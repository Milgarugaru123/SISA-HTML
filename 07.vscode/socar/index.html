<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socar</title>
    <link rel="stylesheet" href="../../Setting/reset.css" />
    <link rel="stylesheet" href="../../Setting/font.css" />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="main.css" />
    <!-- reservation -->
    <link rel="stylesheet" href="first.css" />
    <!-- promotion -->
    <link rel="stylesheet" href="second.css" />
    <!-- member_event -->
    <link rel="stylesheet" href="third.css" />
    <!-- location -->
    <link rel="stylesheet" href="forth.css" />
    <link rel="stylesheet" href="footer.css" />
  </head>
  <body>
    <header>
      <nav>
        <ul class="left">
          <li><img src="socar.svg" alt="SOCAR 로고" /></li>
          <li>예약하기</li>
          <li>쏘카 서비스</li>
          <li>블로그</li>
        </ul>
        <ul class="right">
          <li>로그인</li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="first">
        <div class="contents">
          <p class="top_title">차가 필요할 땐, 쏘카</p>
          <input type="date" name="reserve_date" />
          <input type="text" placeholder="대여 장소 검색" />
          <button>검색</button>
        </div>
      </section>
      <section class="second">
        <div class="contents">
          <p class="title">제주 렌터카도 쏘카인 이유</p>
          <p class="sub_title">
            카셰어링의 편리함은 그대로. 더욱 특별한 제주만의 경험과 혜택까지!
          </p>
        </div>
      </section>
      <section class="third">
        <div class="contents">
          <p class="title">쏘카 회원 전용 혜택</p>
          <p class="sub_title">매일 쏟아지는 혜택을 쏘카에서 만나보세요.</p>
        </div>
      </section>
      <section class="forth">
        <div class="contents">
          <p class="title">어디로 떠날까요?</p>
          <p class="sub_title">여행도 일상도 쏘카와 함께해요</p>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
