<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button Test</title>
  </head>
  <body>
    <button
      style="
        color: white;
        background-color: #ee4444;
        border-radius: 50px;
        border: none;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 10px;
      "
    >
      Button</button
    ><br /><br />
    <!-- 또는 "padding: 10px 10px 10px 10px;" 으로도 '상 우 하 좌' 순서로 가능 -->

    <button
      style="
        color: white;
        background-color: #1d8bff;
        border-radius: 7px;
        border: none;
        padding: 10px 15px 10px 15px;
      "
    >
      로그인/회원가입</button
    ><br /><br />

    <button
      style="
        color: white;
        background-color: #1d8bff;
        border-radius: 7px;
        border: 4px dotted red;
        padding: 10px 10px 10px 10px;
      "
    >
      Border Test
    </button>
    <!-- "border: (크기) (모양) (색상);" -->
  </body>
</html>
