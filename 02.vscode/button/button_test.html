<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Test</title>
</head>
<body>
    <button style="color: red; background-color: greenyellow; border-radius: 100px">日本語</button><br>
    <button style="color: blue; background-color: yellow; border-radius: 5px"><strong>Do the Flip!</strong></button><br>
    <button style="color: white; background-color: black">스시, 사시미</button>
    
    <!-- 배경색 하늘색, 글자색 빨간색, 강조되는 곳은 strong 태그, 강조색 황금색 -->
    <p style="color: red; background-color: skyblue">어제 배운 일본어 문법<br>
        いくらですか<br>
        <strong style="color: gold">何匹ありますか</strong><br>
        また起こしてください<br>
        이 정도?
    </p>
</body>
</html>
