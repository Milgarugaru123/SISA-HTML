<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box</title>
    <link rel="stylesheet" href="box.css" />
  </head>
  <body>
    <!-- 모든 태그는 부모의 넓이를 끝까지 따라감 -->
    <!-- 단, 몇 가지 예외가 있음 -->
    <!-- button, a, img -->
    <!-- 자신의 content에 맞게 따라감 -->
    <p style="background-color: red">배경색 빨강</p>
    <p style="background-color: yellow">배경색 노랑</p>
    <p style="background-color: green">배경색 파랑</p>

    <!-- div 태그: 별 의미 없음 -->
    <!-- 나만의 태그 -->
    <div style="border: 2px solid red; width: 500px">
      <h1 style="background-color: skyblue">프로그래밍 수업</h1>
      <p>프로그래밍 수업인 것이다.</p>
    </div>
  </body>
</html>
